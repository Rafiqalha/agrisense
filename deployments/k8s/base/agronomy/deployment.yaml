apiVersion: apps/v1
kind: Deployment
metadata:
  name: agronomy-service
  labels:
    app: agronomy-service
    part-of: agrisense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agronomy-service
  template:
    metadata:
      labels:
        app: agronomy-service
    spec:
      containers:
        - name: agronomy-service
          image: gcr.io/REPLACE_PROJECT_ID/agrisense/agronomy-service:latest
          ports:
            - containerPort: 3004
          envFrom:
            - secretRef:
                name: agrisense-secrets
            - configMapRef:
                name: agrisense-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agronomy-service
spec:
  selector:
    app: agronomy-service
  ports:
    - port: 3004
      targetPort: 3004
  type: ClusterIP
