apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-gateway
  labels:
    app: whatsapp-gateway
    part-of: agrisense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whatsapp-gateway
  template:
    metadata:
      labels:
        app: whatsapp-gateway
    spec:
      containers:
        - name: whatsapp-gateway
          image: gcr.io/REPLACE_PROJECT_ID/agrisense/whatsapp-gateway:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: agrisense-secrets
            - configMapRef:
                name: agrisense-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-gateway
spec:
  selector:
    app: whatsapp-gateway
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
