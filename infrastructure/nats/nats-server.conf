# AgriSense NATS JetStream Configuration
server_name: agrisense-nats
port: 4222
http_port: 8222

# JetStream — persistent event streaming
jetstream {
    store_dir: "/data"
    max_memory_store: 1GB
    max_file_store: 10GB
}

# Logging
log_time: true
debug: false
trace: false

# Limits
max_payload: 8MB
max_connections: 10000

# Streams (defined in application startup, shown here for documentation)
# Stream: AGRISENSE
#   Subjects: agrisense.>
#   Storage: file
#   Retention: limits
#   Max age: 7 days
#   Max bytes: 5GB
#   Replicas: 1 (dev) / 3 (production)
