# AgriSense Redis Configuration
bind 0.0.0.0
port 6379
protected-mode no

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (RDB)
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb

# Logging
loglevel notice

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Security (set password in production via env)
# requirepass yourpassword

# Keyspace notifications (for cache expiry events)
notify-keyspace-events "Ex"
