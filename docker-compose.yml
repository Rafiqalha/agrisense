x-runtime-env: &runtime-env
  APP_ENV: development
  # Fail closed: env_file may contain a host/owner URL. DB-backed services must
  # explicitly override this with their dedicated least-privilege role.
  DATABASE_URL: ""
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222
  BRAIN_SERVICE_URL: http://brain-service:${BRAIN_SERVICE_PORT:-3002}
  FARM_SERVICE_URL: http://farm-service:${FARM_SERVICE_PORT:-3003}
  AGRONOMY_SERVICE_URL: http://agronomy-service:${AGRONOMY_SERVICE_PORT:-3004}
  FINANCE_SERVICE_URL: http://finance-service:${FINANCE_SERVICE_PORT:-3005}
  MARKETPLACE_SERVICE_URL: http://marketplace-service:${MARKETPLACE_SERVICE_PORT:-3006}
  AI_SERVICE_URL: http://ai-service:${AI_SERVICE_PORT:-3008}
  PLATFORM_SERVICE_URL: http://platform-service:${PLATFORM_SERVICE_PORT:-3009}
  MCP_REGISTRY_URL: http://brain-service:${BRAIN_SERVICE_PORT:-3002}/mcp

x-rust-service: &rust-service
  image: agrisense-local:dev
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env

services:
  # ─── Core Infrastructure ──────────────────────────────────────────────────────
  postgres:
    image: agrisense-postgres-local:pg16
    build:
      context: .
      dockerfile: infrastructure/postgres/Dockerfile
    container_name: agrisense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrisense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-agrisense}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrisense} -d ${POSTGRES_DB:-agrisense}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: agrisense-postgres-local:pg16
    build:
      context: .
      dockerfile: infrastructure/postgres/Dockerfile
    restart: "no"
    environment:
      PGUSER: ${POSTGRES_USER:-agrisense}
      PGPASSWORD: ${POSTGRES_PASSWORD:-secret}
      PGDATABASE: ${POSTGRES_DB:-agrisense}
      PGHOST: postgres
      BRAIN_DB_PASSWORD: ${BRAIN_DB_PASSWORD:-brain-local-only}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway-local-only}
      FARM_DB_PASSWORD: ${FARM_DB_PASSWORD:-farm-local-only}
      AGRONOMY_DB_PASSWORD: ${AGRONOMY_DB_PASSWORD:-agronomy-local-only}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:-finance-local-only}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:-marketplace-local-only}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics-local-only}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform-local-only}
    volumes:
      - ./infrastructure/postgres/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - >-
        for file in /migrations/*.sql; do
          echo "Applying $$file";
          psql -v ON_ERROR_STOP=1 -f "$$file";
        done;
        psql -v ON_ERROR_STOP=1
        -v brain_password="$$BRAIN_DB_PASSWORD"
        -v gateway_password="$$GATEWAY_DB_PASSWORD"
        -v farm_password="$$FARM_DB_PASSWORD"
        -v agronomy_password="$$AGRONOMY_DB_PASSWORD"
        -v finance_password="$$FINANCE_DB_PASSWORD"
        -v marketplace_password="$$MARKETPLACE_DB_PASSWORD"
        -v analytics_password="$$ANALYTICS_DB_PASSWORD"
        -v platform_password="$$PLATFORM_DB_PASSWORD"
        -f /migrations/configure-runtime-roles.psql
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    container_name: agrisense-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: agrisense-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring HTTP
      - "6222:6222"   # cluster
    volumes:
      - nats-data:/data
      - ./infrastructure/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Rust Services ────────────────────────────────────────────────────────────
  brain-service:
    <<: *rust-service
    command: ["/usr/local/bin/brain-service"]
    container_name: agrisense-brain
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://agrisense_brain:${BRAIN_DB_PASSWORD:-brain-local-only}@postgres:5432/${POSTGRES_DB:-agrisense}
      BRAIN_FARM_TOKEN: ${BRAIN_FARM_TOKEN:-brain-farm-local-only-change-me-32bytes}
    ports:
      - "${BRAIN_SERVICE_PORT:-3002}:${BRAIN_SERVICE_PORT:-3002}"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${BRAIN_SERVICE_PORT:-3002}/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    profiles: ["services", "all"]

  farm-service:
    <<: *rust-service
    command: ["/usr/local/bin/farm-service"]
    container_name: agrisense-farm
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://agrisense_farm:${FARM_DB_PASSWORD:-farm-local-only}@postgres:5432/${POSTGRES_DB:-agrisense}
      BRAIN_FARM_TOKEN: ${BRAIN_FARM_TOKEN:-brain-farm-local-only-change-me-32bytes}
    ports:
      - "${FARM_SERVICE_PORT:-3003}:${FARM_SERVICE_PORT:-3003}"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      nats:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${FARM_SERVICE_PORT:-3003}/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["services", "all"]

  agronomy-service:
    <<: *rust-service
    command: ["/usr/local/bin/agronomy-service"]
    container_name: agrisense-agronomy
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://agrisense_agronomy:${AGRONOMY_DB_PASSWORD:-agronomy-local-only}@postgres:5432/${POSTGRES_DB:-agrisense}
    ports:
      - "${AGRONOMY_SERVICE_PORT:-3004}:${AGRONOMY_SERVICE_PORT:-3004}"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      nats:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${AGRONOMY_SERVICE_PORT:-3004}/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["services", "all"]

  finance-service:
    <<: *rust-service
    command: ["/usr/local/bin/finance-service"]
    container_name: agrisense-finance
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://agrisense_finance:${FINANCE_DB_PASSWORD:-finance-local-only}@postgres:5432/${POSTGRES_DB:-agrisense}
    ports:
      - "${FINANCE_SERVICE_PORT:-3005}:${FINANCE_SERVICE_PORT:-3005}"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      nats:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${FINANCE_SERVICE_PORT:-3005}/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["services", "all"]

  marketplace-service:
    <<: *rust-service
    command: ["/usr/local/bin/marketplace-service"]
    container_name: agrisense-marketplace
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://agrisense_marketplace:${MARKETPLACE_DB_PASSWORD:-marketplace-local-only}@postgres:5432/${POSTGRES_DB:-agrisense}
    ports:
      - "${MARKETPLACE_SERVICE_PORT:-3006}:${MARKETPLACE_SERVICE_PORT:-3006}"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      nats:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${MARKETPLACE_SERVICE_PORT:-3006}/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["services", "all"]

  analytics-service:
    <<: *rust-service
    command: ["/usr/local/bin/analytics-service"]
    container_name: agrisense-analytics
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://agrisense_analytics:${ANALYTICS_DB_PASSWORD:-analytics-local-only}@postgres:5432/${POSTGRES_DB:-agrisense}
    ports:
      - "${ANALYTICS_SERVICE_PORT:-3007}:${ANALYTICS_SERVICE_PORT:-3007}"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      nats:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${ANALYTICS_SERVICE_PORT:-3007}/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["services", "all"]

  ai-service:
    <<: *rust-service
    command: ["/usr/local/bin/ai-service"]
    container_name: agrisense-ai
    environment:
      <<: *runtime-env
    ports:
      - "${AI_SERVICE_PORT:-3008}:${AI_SERVICE_PORT:-3008}"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${AI_SERVICE_PORT:-3008}/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["services", "all"]

  platform-service:
    <<: *rust-service
    command: ["/usr/local/bin/platform-service"]
    container_name: agrisense-platform
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://agrisense_platform:${PLATFORM_DB_PASSWORD:-platform-local-only}@postgres:5432/${POSTGRES_DB:-agrisense}
    ports:
      - "${PLATFORM_SERVICE_PORT:-3009}:${PLATFORM_SERVICE_PORT:-3009}"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${PLATFORM_SERVICE_PORT:-3009}/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["services", "all"]

  whatsapp-gateway:
    <<: *rust-service
    command: ["/usr/local/bin/whatsapp-gateway"]
    container_name: agrisense-gateway
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://agrisense_gateway:${GATEWAY_DB_PASSWORD:-gateway-local-only}@postgres:5432/${POSTGRES_DB:-agrisense}
    ports:
      - "${WHATSAPP_GATEWAY_PORT:-3001}:${WHATSAPP_GATEWAY_PORT:-3001}"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      brain-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${WHATSAPP_GATEWAY_PORT:-3001}/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["services", "all"]

  # ─── Monitoring Stack ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: agrisense-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: agrisense-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    profiles: ["monitoring"]

  loki:
    image: grafana/loki:3.1.0
    container_name: agrisense-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    profiles: ["monitoring"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: agrisense-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    profiles: ["monitoring"]

  # ─── NATS UI (local dev only) ─────────────────────────────────────────────────
  nats-box:
    image: natsio/nats-box:latest
    container_name: agrisense-nats-box
    depends_on:
      - nats
    profiles: ["dev-tools"]

volumes:
  postgres-data:
  redis-data:
  nats-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  default:
    name: agrisense-net
